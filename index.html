<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREEN FLASH - Country League Time Left</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui,Arial}.ad{background:#00ff88;color:#000;text-align:center;padding:14px;font-weight:900;margin:8px;border-radius:12px;cursor:pointer}.ad.mid{background:transparent;border:2px dashed #00ff88;color:#00ff88}.top{background:#0a0a0a;padding:14px 16px;display:flex;justify-content:space-between;border-bottom:2px solid #00ff88}.tabs{display:flex;gap:8px;padding:12px;background:#0a0a0a;overflow-x:auto}.tab{border:0;background:#222;color:#aaa;padding:10px 20px;border-radius:99px;font-weight:900;cursor:pointer;white-space:nowrap}.tab.active{background:#00ff88;color:#000}.league{background:#111;border-left:4px solid #00ff88;color:#00ff88;padding:10px 14px;font-weight:900;font-size:12px;margin-top:16px;display:flex;justify-content:space-between}.match{display:flex;align-items:center;padding:12px 14px;background:#151515;border-bottom:1px solid #222;cursor:pointer}.left{width:135px;display:flex;flex-direction:column;gap:2px}.left .time{color:#00ff88;font-weight:900;font-size:15px}.left .country{color:#888;font-size:10px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.left .lname{color:#bbb;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teams{flex:1;font-size:14px;line-height:1.3;padding-left:10px}.s{width:50px;text-align:center;font-weight:900}#pop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99;justify-content:center;align-items:center;padding:16px}.box{background:#171717;border:2px solid #00ff88;border-radius:20px;padding:22px;width:100%;max-width:400px;text-align:center}.row{display:flex;gap:12px;margin:18px 0}.card{flex:1;background:#000;padding:16px;border-radius:14px}.btn{background:#00ff88;color:#000;border:0;padding:14px;width:100%;border-radius:99px;font-weight:900;margin-top:14px;cursor:pointer}.live{color:#ff3b3b;font-weight:900}</style>
</head><body>
<div class="ad" onclick="window.open('https://google.com','_blank')">🔥 AD TOP 🔥</div>
<div class="top"><div><b style="color:#00ff88">⚽ GREEN FLASH</b><br><small style="color:#777">Country • League • Time Left</small></div><div style="color:#00ff88">LIVE</div></div>
<div class="tabs" id="tabs"></div>
<div class="ad mid" onclick="window.open('https://google.com','_blank')">💰 AD MID 💰</div>
<div id="games"><p style="padding:50px;text-align:center;color:#00ff88">Loading...</p></div>
<div id="pop" onclick="if(event.target==this)closePop()"><div class="box"><h3 id="ptitle" style="color:#00ff88">MATCH</h3><div class="row"><div class="card"><small style="color:#00ff88">HT</small><br><b id="ht">-</b></div><div class="card"><small style="color:#00ff88">FT</small><br><b id="ft">-</b></div></div><p id="pinfo" style="color:#888;font-size:12px"></p><div class="ad" onclick="window.open('https://google.com','_blank')">AD POPUP</div><button class="btn" onclick="closePop()">CLOSE</button></div></div>
<script>
var all=[];const fmt=d=>d.toISOString().split('T')[0];const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x;};
let today=new Date();let dates=[{L:'YESTERDAY',D:fmt(add(today,-1))},{L:'TODAY',D:fmt(today)},{L:'TOMORROW',D:fmt(add(today,1))},{L:fmt(add(today,2)),D:fmt(add(today,2))}];
function build(){let h='';dates.forEach((x,i)=>{h+=`<button class="tab ${i==1?'active':''}" onclick="load('${x.D}',this)">${x.L}</button>`});document.getElementById('tabs').innerHTML=h;load(dates[1].D);}
async function load(d,el){if(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}document.getElementById('games').innerHTML=`<p style="padding:30px;text-align:center;color:#00ff88">Loading ${d}...</p>`;try{let r=await fetch('/matches?date='+d);let j=await r.json();all=j.data.matches||[];show(d);}catch{ document.getElementById('games').innerHTML='<p style="padding:30px;text-align:center">Error</p>';}}
function show(dateStr){
 if(!all.length){document.getElementById('games').innerHTML=`<p style="padding:40px;text-align:center">No games for ${dateStr}<br><small style="color:#666">Check FOOTBALL_API_KEY</small></p>`;return;}
 let html='';let groups={};
 all.forEach(m=>{let key=(m.league.country||'')+'|'+m.league.name;if(!groups[key])groups[key]={country:m.league.country||'World',name:m.league.name,list:[]};groups[key].list.push(m);});
 Object.keys(groups).sort().forEach(k=>{
  let g=groups[k];
  html+=`<div class="league"><span>${(g.country+' - '+g.name).toUpperCase()}</span><span>▼</span></div>`;
  g.list.forEach(m=>{
   let timeDisplay=m.status=='finished'?'FT':m.status=='live'?`<span class="live">${m.liveMinute||'LIVE'}</span>`:m.time;
   let score=m.ft_home!=null?`${m.ft_home} - ${m.ft_away}`:'-';
   html+=`<div class="match" onclick="openP('${m.id}')">
    <div class="left">
      <div class="time">${timeDisplay}</div>
      <div class="country">${g.country}</div>
      <div class="lname">${g.name}</div>
    </div>
    <div class="teams">${m.home.name} - ${m.away.name}</div>
    <div class="s">${score}</div>
   </div>`;
  });
 });
 document.getElementById('games').innerHTML=html;
}
function openP(id){let m=all.find(x=>String(x.id)==String(id));if(!m)return;document.getElementById('ptitle').textContent=m.home.name+' vs '+m.away.name;document.getElementById('ht').textContent=m.ht_home!=null?`${m.ht_home} - ${m.ht_away}`:'0 - 0';document.getElementById('ft').textContent=m.ft_home!=null?`${m.ft_home} - ${m.ft_away}`:'-';document.getElementById('pinfo').textContent=`${m.league.country} - ${m.league.name} | ${m.time} CET | ${m.status}`;document.getElementById('pop').style.display='flex';}
function closePop(){document.getElementById('pop').style.display='none';}
build();
</script></body></html>
