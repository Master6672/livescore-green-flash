<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore TOP 10</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}
.ad{background:#00ff66;color:#000;padding:14px;text-align:center;font-weight:900;cursor:pointer;font-size:16px}
.ad-mid{background:#000;color:#00ff66;border:2px dashed #00ff66;margin:10px;border-radius:10px;padding:14px;text-align:center;font-weight:900;cursor:pointer}
.head{background:#0a0a0a;padding:12px 10px;border-bottom:3px solid #00ff66;display:flex;justify-content:space-between;align-items:center}
.days{display:flex;gap:8px;padding:10px;background:#000;overflow:auto;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{min-width:95px;padding:10px 6px;background:#1a1a1a;border:1px solid #333;border-radius:12px;text-align:center;cursor:pointer;color:#888;font-size:13px;font-weight:700;line-height:1.2}.day.active{background:#00ff66;color:#000;border-color:#00ff66}
.filters{display:flex;gap:8px;padding:10px;background:#000;overflow:auto}.f{flex:1;min-width:85px;padding:10px 6px;background:#111;border:1px solid #333;border-radius:20px;text-align:center;cursor:pointer;font-weight:900;font-size:12px;color:#888;white-space:nowrap}.f.active{background:#00ff66;color:#000}.f.refresh{background:#00ff66;color:#000}
.league{background:#111;color:#00ff66;padding:8px 12px;font-weight:900;font-size:11px;display:flex;justify-content:space-between;border-left:4px solid #00ff66;border-top:1px solid #222}
.match{display:flex;align-items:center;padding:12px;border-bottom:1px solid #111;background:#000;cursor:pointer}
.time{width:58px;font-weight:900;font-size:13px}.time.live{color:#ff2222}.time.ns{color:#00ff66}.time.fin{color:#888}
.teams{flex:1;font-size:13px}.score{font-weight:900;min-width:65px;text-align:right}.score.live{color:#ff2222}.score.ns{color:#555}.score.fin{color:#00ff66}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);justify-content:center;align-items:center;z-index:999}
#box{background:#0a1a0a;border:2px solid #00ff66;border-radius:16px;width:92%;max-width:330px;padding:20px}
</style></head><body>
<div class="ad" onclick="window.open('https://google.com','_blank')">AD TOP - CLICK HERE</div>
<div class="head"><b style="color:#00ff66">⚽ LiveScore TOP 10</b><span style="font-size:11px;color:#aaa">EUROPE TIME CET</span></div>

<!-- DATE TABS LIKE YOUR SCREENSHOT -->
<div class="days" id="days"></div>

<!-- ALL GAME TODAY LIVE FINISHED REFRESH BUTTONS -->
<div class="filters">
<div class="f active" id="fAll" onclick="setFilter('all')">ALL GAMES</div>
<div class="f" id="fLive" onclick="setFilter('live')">🔴 LIVE</div>
<div class="f" id="fFin" onclick="setFilter('finished')">✅ FINISHED</div>
<div class="f refresh" onclick="loadMatches()">🔄 REFRESH</div>
</div>

<div class="ad-mid" onclick="window.open('https://google.com','_blank')">AD MID - CLICK HERE</div>
<div id="list" style="min-height:200px"></div>
<div class="ad-mid" onclick="window.open('https://google.com','_blank')">AD BOTTOM - CLICK</div>

<div id="modal" onclick="if(event.target==this)this.style.display='none'"><div id="box"><h2 style="text-align:center;color:#00ff66">HT - FT</h2><div id="mTime2" style="text-align:center;color:#00ff66;font-weight:900;margin:10px 0;background:#000;padding:8px;border-radius:8px"></div><div style="background:#000;border-radius:12px;padding:12px;border:1px solid #222"><div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #222"><span style="color:#aaa">HALF TIME:</span><span style="color:#ffaa00;font-size:22px;font-weight:900" id="mHT"></span></div><div style="display:flex;justify-content:space-between;padding:12px 0"><span style="color:#aaa">FULL TIME:</span><span style="color:#00ff66;font-size:22px;font-weight:900" id="mFT"></span></div></div><div style="text-align:center;margin-top:12px;color:#00ff66;font-size:12px" id="mTimeExtra"></div></div></div>

<script>
var curDate=new Date().toISOString().split('T')[0];var allMatches=[];var curFilter='all';
function loadDays(){
  var h='';var labels=['Fri 10-16','Yesterday 10-17','Today 10-18','Tomorrow 10-19'];
  var offsets=[-2,-1,0,1];
  for(var i=0;i<4;i++){
    var d=new Date();d.setDate(d.getDate()+offsets[i]);
    var iso=d.toISOString().split('T')[0];
    var lab=labels[i];
    var a=iso==curDate?' active':'';
    h+='<div class="day'+a+'" onclick="setDay(\''+iso+'\',this)">'+lab+'</div>';
  }
  document.getElementById('days').innerHTML=h;
}
function setDay(date,el){curDate=date;document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));el.classList.add('active');loadMatches();}
function setFilter(f){curFilter=f;document.querySelectorAll('.filters .f').forEach(x=>{if(!x.classList.contains('refresh'))x.classList.remove('active')});if(f=='all')document.getElementById('fAll').classList.add('active');if(f=='live')document.getElementById('fLive').classList.add('active');if(f=='finished')document.getElementById('fFin').classList.add('active');render();}
async function loadMatches(){
  document.getElementById('list').innerHTML='<div style="padding:30px;text-align:center;color:#00ff66">⏳ Loading...</div>';
  try{
    var r=await fetch('/matches?date='+curDate+'&t='+Date.now(),{cache:'no-store'});
    var j=await r.json();
    allMatches=j.data.matches||[];
    // If still empty, try without date
    if(allMatches.length==0){
      var r2=await fetch('/matches?t='+Date.now(),{cache:'no-store'});
      var j2=await r2.json();
      allMatches=j2.data.matches||[];
    }
    render();
  }catch(e){document.getElementById('list').innerHTML='<div style="padding:20px;text-align:center;color:#888">No matches for '+curDate+'<br><br><span style="color:#00ff66" onclick="loadMatches()">🔄 Retry</span></div>';}
}
function render(){
  var html='',last='';var filtered=allMatches.filter(m=>{if(curFilter=='live')return m.status=='live';if(curFilter=='finished')return m.status=='finished';return true;});
  if(filtered.length==0){document.getElementById('list').innerHTML='<div style="padding:30px;text-align:center;color:#888">No matches for '+curDate+'</div>';return;}
  filtered.forEach(m=>{
    var key=m.league.country+': '+m.league.name;
    if(key!=last){html+='<div class="league"><span>'+key.toUpperCase()+'</span><span>STANDINGS</span></div>';last=key;}
    var isLive=m.status=='live';var isNS=m.status=='notstarted';
    var timeDisplay=isLive?(m.liveMinute||'LIVE'):m.time;
    var timeClass=isLive?'live':isNS?'ns':'fin';
    var scoreText=isNS?'-':(m.ft_home!=null?m.ft_home+' - '+m.ft_away:'-');
    var scoreClass=isLive?'live':isNS?'ns':'fin';
    html+='<div class="match" onclick="openHTFT(\''+m.id+'\')"><div class="time '+timeClass+'">'+timeDisplay+'</div><div class="teams">'+m.home.name+' - '+m.away.name+'</div><div class="score '+scoreClass+'">'+scoreText+'</div></div>';
  });
  document.getElementById('list').innerHTML=html;
}
function openHTFT(id){var m=allMatches.find(x=>String(x.id)==String(id));if(!m)return;document.getElementById('mTime2').textContent='KICK-OFF: '+m.time+' CET';var ht=(m.ht_home!=null)?m.ht_home+' - '+m.ht_away:'-';var ft=(m.ft_home!=null)?m.ft_home+' - '+m.ft_away:'-';document.getElementById('mHT').textContent=ht;document.getElementById('mFT').textContent=ft;document.getElementById('mTimeExtra').textContent=(m.status=='live'?m.liveMinute+' | LIVE':m.time+' | '+m.status.toUpperCase());document.getElementById('modal').style.display='flex';}
loadDays();loadMatches();
</script></body></html>
