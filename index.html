<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore HT-FT - FAST GREEN BLACK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070f09;color:#fff;font-family:Arial,sans-serif}
.top{background:#0a1a0f;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.top b{color:#00ff88;font-size:15px}
.top small{color:#00c853;font-size:10px;font-weight:700}
.ad{border:2px dashed #00c853;color:#00c853;text-align:center;padding:14px;margin:8px;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer;background:#0a1a0f}
.tabs{display:flex;gap:6px;padding:10px;overflow-x:auto}
.tab{background:#1c3323;color:#8aa88f;border:0;padding:10px 16px;border-radius:12px;font-weight:800;min-width:90px;line-height:1.1;cursor:pointer}
.tab b{display:block;font-size:14px;color:#fff}
.tab.active{background:#00ff88;color:#000}
.tab.active b{color:#000}
.filters{display:flex;gap:6px;padding:10px;overflow-x:auto;border-bottom:1px solid #122218}
.f{background:#1a2e22;color:#888;border:0;padding:8px 14px;border-radius:99px;font-weight:700;font-size:12px;cursor:pointer}
.f.active{background:#fff;color:#000}
.league{background:#122218;padding:10px 12px;display:flex;justify-content:space-between;border-left:4px solid #00c853;font-size:13px;font-weight:700;margin-top:2px}
.league span{color:#6b8a70;font-size:11px;font-weight:400}
.match{display:flex;align-items:center;padding:12px 10px;background:#070f09;border-bottom:1px solid #122218}
.time{width:50px;color:#00ff88;font-weight:900;font-size:14px}
.teams{flex:1;font-size:14px;line-height:1.3}
.score{width:55px;text-align:right;color:#00ff88;font-weight:900;font-size:15px}
.score.live{color:#ff3b3b}
</style>
</head>
<body>
<div class="top"><b>⚽ LiveScore HT-FT</b><small>FAST • GREEN • BLACK</small></div>

<div class="ad" onclick="window.open('https://t.me/YOUR_TELEGRAM','_blank')">AD SPACE TOP - CLICKABLE → Put your<br>Telegram / Betting Link Here</div>

<div class="tabs" id="tabs"></div>

<div class="filters">
<button class="f active" id="fAll" onclick="setF('all',this)">Games</button>
<button class="f" onclick="setF('live',this)">Live</button>
<button class="f" onclick="setF('finished',this)">Finished</button>
<button class="f" onclick="location.reload()">↻ Refresh</button>
<button class="f" onclick="toggleSort()" id="sortBtn">Top 1-10 ⌄</button>
</div>

<div class="ad" onclick="window.open('https://YOUR-AD-LINK.com','_blank')">AD SPACE MID - CLICKABLE → Your Ad Link</div>

<div id="games"><p style="padding:40px;text-align:center;color:#00ff88">Loading...</p></div>

<script>
let ALL=[], FILTER='all', SORT=true;
function fmt(d){return d.toISOString().split('T')[0];}
function fmtMD(d){return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x;}
let TODAY=new Date();
let DATES=[
 {label:'Today',sub:fmtMD(TODAY),date:fmt(TODAY)},
 {label:'Tomorrow',sub:fmtMD(add(TODAY,1)),date:fmt(add(TODAY,1))},
 {label:'Tue',sub:fmtMD(add(TODAY,2)),date:fmt(add(TODAY,2))},
 {label:'Wed',sub:fmtMD(add(TODAY,3)),date:fmt(add(TODAY,3))},
 {label:'Thu',sub:fmtMD(add(TODAY,4)),date:fmt(add(TODAY,4))},
];

function build(){
 let h=''; DATES.forEach((d,i)=>{
   h+=`<button class="tab ${i===1?'active':''}" onclick="loadD('${d.date}',this)"><b>${d.label}</b>${d.sub}</button>`;
 }); document.getElementById('tabs').innerHTML=h; loadD(DATES[1].date,null);
}
async function loadD(date,el){
 if(el){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
 document.getElementById('games').innerHTML=`<p style="padding:30px;text-align:center;color:#00ff88">Loading ${date}...</p>`;
 try{
  let r=await fetch('/matches?date='+date+'&t='+Date.now()); let j=await r.json();
  ALL=j.data?.matches||[]; render();
 }catch{ document.getElementById('games').innerHTML=`<p style="padding:30px;text-align:center">No games</p>`; }
}
function setF(f,el){FILTER=f;document.querySelectorAll('.f').forEach(b=>{if(b.id!=='sortBtn')b.classList.remove('active')});el.classList.add('active');render();}
function toggleSort(){SORT=!SORT;document.getElementById('sortBtn').textContent=SORT?'Top 1-10 ⌄':'A-Z ⌄';render();}
function render(){
 let list=ALL.filter(m=>{if(FILTER==='live'&&m.status!=='live')return false;if(FILTER==='finished'&&m.status!=='finished')return false;return true;});
 if(SORT){ const o={England:1,Spain:2,Germany:3,Italy:4,France:5}; list.sort((a,b)=>(o[a.league.country]||99)-(o[b.league.country]||99)); }
 let groups={}; list.forEach(m=>{let k=m.league.country+' - '+m.league.name; if(!groups[k])groups[k]={name:k,c:0,list:[]}; groups[k].list.push(m); groups[k].c++;});
 let html=''; Object.keys(groups).forEach(k=>{
  let g=groups[k];
  html+=`<div class="league"><div>${g.name} (${g.c})</div><span>Standings >></span></div>`;
  g.list.forEach(m=>{
    let score=m.ft_home!=null?`${m.ft_home} - ${m.ft_away}`:'vs';
    let cls=m.status==='live'?'score live':'score';
    // TIME NOW SHOWS ALWAYS - 13:00, 15:30 etc
    html+=`<div class="match"><div class="time">${m.time}</div><div class="teams">${m.home.name}<br>${m.away.name}</div><div class="${cls}">${score}${m.status==='live'?' '+m.liveMinute:''}</div></div>`;
  });
 });
 document.getElementById('games').innerHTML=html||`<p style="padding:40px;text-align:center;color:#666">No matches for this date</p>`;
}
build();
</script>
</body>
</html>
