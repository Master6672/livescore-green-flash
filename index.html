<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}
.head{background:#000;padding:12px;border-bottom:3px solid #00ff66;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:6px;padding:8px;background:#000}.tab{flex:1;padding:10px;background:#111;border:1px solid #222;border-radius:20px;text-align:center;cursor:pointer;font-weight:900;font-size:13px;color:#888}.tab.active{background:#00ff66;color:#000}
.days{display:flex;gap:6px;padding:8px;background:#000;overflow:auto}.day{min-width:75px;padding:8px;background:#111;border:1px solid #222;border-radius:10px;text-align:center;cursor:pointer;color:#888;font-size:11px;font-weight:700}.day.active{background:#00ff66;color:#000}
.league{background:#0a0a0a;color:#00ff66;padding:8px 12px;font-weight:900;font-size:11px;text-transform:uppercase;display:flex;justify-content:space-between;border-left:4px solid #00ff66;border-top:1px solid #1a1a1a}
.match{display:flex;align-items:center;padding:11px;border-bottom:1px solid #111;background:#000;cursor:pointer}
.time{width:55px;font-weight:900;font-size:13px}.time.live{color:#ff2222}.time.notstarted{color:#00ff66}.time.finished{color:#888}
.teams{flex:1;font-size:13px}.score{font-weight:900;min-width:60px;text-align:right;font-size:14px}.score.live{color:#ff2222}.score.fin{color:#00ff66}.score.ns{color:#888}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);justify-content:center;align-items:center;z-index:999}
#box{background:#0a1a0a;border:2px solid #00ff66;border-radius:16px;width:92%;max-width:330px;padding:20px}
.ad{padding:12px;text-align:center;font-weight:900;cursor:pointer}.ad-top{background:#00ff66;color:#000}.ad-mid{background:#0a1a0a;color:#00ff66;border:1px dashed #00ff66;margin:8px;border-radius:10px}
</style></head><body>
<div class="ad ad-top" onclick="window.open('https://google.com','_blank')">🔥 AD TOP</div>
<div class="head"><b style="color:#00ff66">⚽ LiveScore HT-FT</b><div><span id="refreshBtn" onclick="loadMatches()" style="background:#00ff66;color:#000;padding:6px 14px;border-radius:15px;font-size:12px;font-weight:900;cursor:pointer">🔄 REFRESH</span><span id="count" style="font-size:10px;color:#00ff66;border:1px solid #00ff66;padding:3px 6px;border-radius:10px;margin-left:6px">0 GAMES</span></div></div>
<div class="tabs"><div class="tab active" id="tabAll" onclick="setFilter('all')">ALL GAMES</div><div class="tab" id="tabLive" onclick="setFilter('live')">🔴 LIVE</div><div class="tab" id="tabFin" onclick="setFilter('finished')">✅ FINISHED</div></div>
<div class="days" id="days"></div>
<div class="ad ad-mid" onclick="window.open('https://google.com','_blank')">💰 AD MID</div>
<div id="list"></div>
<div id="modal" onclick="if(event.target==this)this.style.display='none'"><div id="box"><h2 style="text-align:center;color:#00ff66">HT - FT</h2><div id="mTime2" style="text-align:center;color:#00ff66;font-weight:900;margin:10px 0;background:#000;padding:8px;border-radius:8px"></div><div style="background:#000;border-radius:12px;padding:12px;border:1px solid #222"><div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #222"><span style="color:#aaa">HALF TIME:</span><span style="color:#ffaa00;font-size:22px;font-weight:900" id="mHT"></span></div><div style="display:flex;justify-content:space-between;padding:12px 0"><span style="color:#aaa">FULL TIME:</span><span style="color:#00ff66;font-size:22px;font-weight:900" id="mFT"></span></div></div><div style="text-align:center;margin-top:12px;color:#00ff66;font-size:12px" id="mTimeExtra"></div></div></div>
<script>
var curDate=new Date().toISOString().split('T')[0];var allMatches=[];var curFilter='all';
function loadDays(){var h='';for(var i=-2;i<=3;i++){var d=new Date();d.setDate(d.getDate()+i);var iso=d.toISOString().split('T')[0];var label=i==0?'Today':i==-1?'Yesterday':i==1?'Tomorrow':d.toLocaleDateString('en',{weekday:'short'});var a=iso==curDate?' active':'';h+='<div class="day'+a+'" onclick="setDay(\''+iso+'\',this)">'+label+'<br>'+(d.getMonth()+1)+'-'+d.getDate()+'</div>';}document.getElementById('days').innerHTML=h;}
function setDay(date,el){curDate=date;document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));el.classList.add('active');loadMatches();}
function setFilter(f){curFilter=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(f=='all'?'tabAll':f=='live'?'tabLive':'tabFin').classList.add('active');render();}
async function loadMatches(){document.getElementById('refreshBtn').textContent='⏳ LOADING...';try{var r=await fetch('/matches?date='+curDate+'&t='+Date.now(),{cache:'no-store'});var j=await r.json();allMatches=j.data.matches||[];document.getElementById('count').textContent=allMatches.length+' GAMES';render();document.getElementById('refreshBtn').textContent='🔄 REFRESH';}catch(e){document.getElementById('refreshBtn').textContent='❌ RETRY';}}
function render(){var html='',last='';var filtered=allMatches.filter(m=>{if(curFilter=='live')return m.status=='live';if(curFilter=='finished')return m.status=='finished';return true;});filtered.forEach(m=>{var key=m.league.country+': '+m.league.name;if(key!=last){html+='<div class="league"><span>'+key.toUpperCase()+'</span><span>STANDINGS</span></div>';last=key;}var isLive=m.status=='live';var isNS=m.status=='notstarted';var timeDisplay=isLive?m.liveMinute:m.time;var timeClass=isLive?'live':isNS?'notstarted':'finished';var scoreText=isNS?'-':(m.ft_home!=null?m.ft_home+' - '+m.ft_away:'-');var scoreClass=isLive?'live':isNS?'ns':'fin';html+='<div class="match" onclick="openHTFT(\''+m.id+'\')"><div class="time '+timeClass+'">'+timeDisplay+'</div><div class="teams">'+m.home.name+' - '+m.away.name+'</div><div class="score '+scoreClass+'">'+scoreText+'</div></div>';});document.getElementById('list').innerHTML=html||'<div style="padding:30px;text-align:center;color:#888">No games</div>';}
function openHTFT(id){var m=allMatches.find(x=>String(x.id)==String(id));if(!m)return;document.getElementById('mTime2').textContent='KICK-OFF: '+m.time+' EUROPE';var ht=(m.ht_home!=null)?m.ht_home+' - '+m.ht_away:'-';var ft=(m.ft_home!=null)?m.ft_home+' - '+m.ft_away:'-';document.getElementById('mHT').textContent=ht;document.getElementById('mFT').textContent=ft;document.getElementById('mTimeExtra').textContent=(m.status=='live'?m.liveMinute+' | LIVE':m.time+' | '+m.status.toUpperCase());document.getElementById('modal').style.display='flex';}
loadDays();loadMatches();
</script></body></html>
