<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livescore</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
.header{padding:16px;font-size:18px;font-weight:900;background:#111}
.date-tabs{display:flex;gap:8px;padding:12px 10px;overflow-x:auto;background:#111;border-bottom:1px solid #222}
.date-tab{background:#222;color:#888;border:0;padding:10px 20px;border-radius:99px;font-weight:700;white-space:nowrap;cursor:pointer}
.date-tab.active{background:#00c853;color:#000;font-weight:900}
.filters{display:flex;gap:8px;padding:12px 10px;overflow-x:auto;background:#111;border-bottom:1px solid #222}
.filter{background:#222;color:#888;border:0;padding:8px 18px;border-radius:99px;font-weight:700;cursor:pointer}
.filter.active{background:#fff;color:#000}
.search{margin:12px 10px;background:#1e1e1e;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.search input{background:transparent;border:0;color:#fff;width:100%;outline:none;font-size:15px}
.league{background:#1e2a23;display:flex;justify-content:space-between;padding:10px 12px;color:#00c853;font-weight:900;font-size:13px;text-transform:uppercase;margin-top:2px}
.league span{color:#00c853;text-decoration:underline;font-weight:400;text-transform:none;font-size:12px;cursor:pointer}
.match{display:flex;align-items:center;padding:12px 12px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;cursor:pointer}
.match .time{width:55px;color:#888;font-size:14px;font-weight:700}
.match .teams{flex:1;font-size:15px;line-height:1.4}
.match .score{width:30px;text-align:right;color:#888;font-weight:900}
</style>
</head>
<body>
<div class="header" id="headerDate">France 2026-10-17</div>

<div class="date-tabs" id="dateTabs"></div>

<div class="filters" id="filterTabs">
<button class="filter active" onclick="setFilter('all',this)">All</button>
<button class="filter" onclick="setFilter('live',this)">Live</button>
<button class="filter" onclick="setFilter('finished',this)">Finished</button>
<button class="filter" onclick="setFilter('scheduled',this)">Scheduled</button>
<button class="filter" onclick="location.reload()">↻</button>
</div>

<div class="search"><span>🔍</span><input id="searchBox" placeholder="Search..." oninput="doSearch()"></div>

<div id="games"></div>

<script>
let ALL=[];
let FILTER='all';
let SEARCH='';

function fmt(d){return d.toISOString().split('T')[0];}
function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x;}
let TODAY=new Date();
let DATES=[
{label:'10-15', date:fmt(add(TODAY,-2))},
{label:'Yesterday', date:fmt(add(TODAY,-1))},
{label:'Today', date:fmt(TODAY)},
{label:'Tomorrow', date:fmt(add(TODAY,1))},
{label:fmt(add(TODAY,2)), date:fmt(add(TODAY,2))}
];

function buildDateTabs(){
let h='';
DATES.forEach((d,i)=>{
h+=`<button class="date-tab ${d.label==='Today'?'active':''}" onclick="loadDate('${d.date}',this)">${d.label}</button>`;
});
document.getElementById('dateTabs').innerHTML=h;
loadDate(fmt(TODAY),null);
}

async function loadDate(dateStr,el){
if(el){document.querySelectorAll('.date-tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
document.getElementById('headerDate').textContent='France '+dateStr;
document.getElementById('games').innerHTML=`<p style="padding:40px;text-align:center;color:#555">Loading ${dateStr}...</p>`;
try{
let r=await fetch('/matches?date='+dateStr+'&t='+Date.now());
let j=await r.json();
ALL=j.data?.matches||[];
render();
}catch(e){document.getElementById('games').innerHTML=`<p style="padding:30px;text-align:center;color:#666">No games</p>`;}
}

function setFilter(f,el){
FILTER=f;
document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));
if(el)el.classList.add('active');
render();
}
function doSearch(){
SEARCH=document.getElementById('searchBox').value.toLowerCase();
render();
}

function render(){
let list=ALL.filter(m=>{
if(FILTER==='live' && m.status!=='live')return false;
if(FILTER==='finished' && m.status!=='finished')return false;
if(FILTER==='scheduled' && m.status!=='notstarted')return false;
if(SEARCH && !(m.home.name.toLowerCase().includes(SEARCH) || m.away.name.toLowerCase().includes(SEARCH) || m.league.name.toLowerCase().includes(SEARCH)))return false;
return true;
});

if(!list.length){document.getElementById('games').innerHTML=`<p style="padding:40px;text-align:center;color:#555">No matches</p>`;return;}

let groups={};
list.forEach(m=>{
let key=(m.league.country||'World').toUpperCase()+': '+m.league.name.toUpperCase();
if(!groups[key])groups[key]=[];
groups[key].push(m);
});

let html='';
Object.keys(groups).sort().forEach(k=>{
html+=`<div class="league"><div>${k}</div><span>Standings</span></div>`;
groups[k].forEach(m=>{
let score=m.ft_home!=null?`${m.ft_home} - ${m.ft_away}`:'-';
if(m.status==='live')score=`<span style="color:#ff3b3b">${m.liveMinute||'LIVE'}</span>`;
html+=`<div class="match"><div class="time">${m.time}</div><div class="teams">${m.home.name}<br>${m.away.name}</div><div class="score">${score}</div></div>`;
});
});
document.getElementById('games').innerHTML=html;
}

buildDateTabs();
</script>
</body>
</html>
