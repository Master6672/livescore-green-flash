<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore HT-FT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070e07;color:#fff;font-family:Arial}
.ad-top{position:sticky;top:0;z-index:200;background:#00c853;color:#000;padding:12px;text-align:center;font-weight:900;display:block;text-decoration:none}
.ad-mid{background:#0f1f0f;border:1px dashed #00e676;margin:8px;padding:12px;text-align:center;color:#00e676;border-radius:8px;display:block;text-decoration:none;font-weight:700}
header{position:sticky;top:44px;z-index:100;background:#0a130a;border-bottom:2px solid #00c853;padding:8px}
.logo{font-weight:900;color:#00e676;font-size:18px;padding:4px 0}
.days{display:flex;gap:6px;overflow:auto;padding:8px 0;min-height:50px}
.day{min-width:74px;padding:8px 4px;background:#122112;border-radius:10px;text-align:center;cursor:pointer;border:1px solid #1d331d;flex-shrink:0}
.day.active{background:#00c853;color:#000;font-weight:800}
.filters{display:flex;gap:6px;overflow:auto;padding:8px 0;align-items:center}
.fbtn{padding:7px 12px;background:#162616;border-radius:20px;cursor:pointer;border:1px solid #244524;font-size:13px;white-space:nowrap;flex-shrink:0}
.fbtn.active{background:#fff;color:#000;font-weight:700}
.leagueHead{background:#0e1e0e;padding:9px 10px;margin-top:10px;border-left:4px solid #00c853;display:flex;justify-content:space-between;font-size:13px}
.match{display:flex;align-items:center;padding:11px 8px;background:#111f11;margin:1px 0;cursor:pointer}
.timeCol{width:60px;font-size:13px;color:#a5d6a7;text-align:center;font-weight:700}
.teamCol{flex:1;padding-left:10px}
.scoreCol{min-width:50px;text-align:right;font-weight:900;color:#00e676}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;justify-content:center;align-items:center;padding:12px}
#modalBox{background:#0f1f0f;border:2px solid #00c853;border-radius:14px;width:100%;max-width:400px}
.content{padding:14px}
</style>
</head>
<body>

<a class="ad-top" href="https://wa.me/234YOURNUMBER" target="_blank">🔥 AD ON TOP - CLICKABLE → PUT YOUR LINK HERE 🔥</a>

<header>
<div class="logo">⚽ LiveScore HT-FT <span style="float:right;font-size:11px;color:#66bb6a">FAST • GREEN • BLACK</span></div>
<div class="days" id="days"></div>
<div class="filters">
<div class="fbtn active" data-f="all" onclick="setF('all')">All Games</div>
<div class="fbtn" data-f="live" onclick="setF('live')">Live</div>
<div class="fbtn" data-f="finished" onclick="setF('finished')">Finished</div>
<div class="fbtn" onclick="loadMatches()">↻ Refresh</div>
<select id="sortSel" onchange="render()" style="background:#162616;color:#fff;border-radius:8px;padding:5px"><option value="top">Top 1-10</option><option value="az">A-Z</option></select>
</div>
</header>

<a class="ad-mid" href="https://wa.me/234YOURNUMBER" target="_blank">AD MID - CLICKABLE → Your Link</a>
<div id="list" style="min-height:200px"></div>
<a class="ad-mid" href="https://wa.me/234YOURNUMBER" target="_blank">AD BOTTOM - CLICKABLE → Your Link</a>

<div id="modal" onclick="if(event.target==this)closeModal()"><div id="modalBox"></div></div>

<script>
let curDate=new Date().toISOString().split('T')[0];
let filter='all';
let allMatches=[];

function getTopRank(m){
 try{
  let name=(m.league?.name||m.leagueName||"").toLowerCase();
  let country=(m.league?.country||m.country||"").toLowerCase();
  if(name.includes("champions league")) return 0;
  if(name.includes("europa league") && !name.includes("conference")) return 1;
  if(name.includes("conference league")) return 2;
  if(country==="england" && name.includes("premier")) return 3;
  if(country==="france" && name.includes("ligue 1")) return 4;
  if(country==="germany" && name.includes("bundesliga")) return 5;
  if(country==="italy" && name.includes("serie a")) return 6;
  if(country==="spain" && (name.includes("la liga")||name.includes("laliga"))) return 7;
  if(country==="netherlands" && name.includes("eredivisie")) return 8;
  if(country==="portugal" && name.includes("primeira")) return 9;
  return 99;
 }catch(e){return 99;}
}

function loadDays(){
 let d=document.getElementById('days');
 if(!d) return;
 let html='';
 for(let i=-4;i<=4;i++){
  let dt=new Date(); dt.setDate(dt.getDate()+i);
  let iso=dt.toISOString().split('T')[0];
  let label=i==-1?'Yesterday':i==0?'Today':i==1?'Tomorrow':dt.toLocaleDateString('en',{weekday:'short'});
  let active = iso===curDate ? 'active' : '';
  html+=`<div class="day ${active}" onclick="pickDate('${iso}')"><b>${label}</b><br><small>${iso.slice(5)}</small></div>`;
 }
 d.innerHTML=html;
}
function pickDate(iso){curDate=iso; loadDays(); loadMatches();}
function setF(f){
 filter=f;
 document.querySelectorAll('.fbtn').forEach(b=>{ if(b.textContent.includes('All')||b.textContent.includes('Live')||b.textContent.includes('Finished')) b.classList.remove('active'); });
 event.target.classList.add('active');
 render();
}

async function loadMatches(){
 let list=document.getElementById('list');
 list.innerHTML='<div style="padding:20px;text-align:center;color:#66bb6a">Loading games for '+curDate+'...</div>';
 try{
  let r=await fetch(`/api/matches?date=${curDate}`);
  let j=await r.json();
  allMatches=j.data?.matches||j.matches||j.data||[];
  if(!Array.isArray(allMatches)) allMatches=[];
 }catch(e){
  list.innerHTML='<div style="padding:20px;text-align:center;color:#ff5252">API error - Check /api/matches?date='+curDate+'<br><button onclick="loadMatches()" style="margin-top:10px;padding:8px 16px;background:#00c853;border:none;border-radius:8px">Retry</button></div>';
  return;
 }
 render();
}

function getTimeStr(m){
 let raw = m.time || m.start_time || m.kickoff || "";
 if(!raw) return "--:--";
 try{
  let d=new Date(raw);
  if(!isNaN(d.getTime())){
   return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'});
  }
  let mm=String(raw).match(/(\d{1,2}:\d{2})/);
  if(mm) return mm[1];
  return "--:--";
 }catch{return "--:--";}
}

function render(){
 let sort=document.getElementById('sortSel')?.value||'top';
 let filtered=allMatches.filter(m=>{
  if(filter==='finished' && m.status!=='finished' && m.status!=='FT') return false;
  if(filter==='live' && !m.isLive && m.status!=='live') return false;
  return true;
 });

 if(filtered.length===0){
  document.getElementById('list').innerHTML='<div style="padding:30px;text-align:center;color:#81c784">No games for '+curDate+'<br><small>Try Yesterday / Today - Tomorrow may have no games yet</small></div>';
  return;
 }

 let grouped={};
 filtered.forEach(m=>{
  let country=m.league?.country||m.country||'Other';
  let lname=m.league?.name||m.leagueName||'League';
  let k=`${country}::${lname}`;
  if(!grouped[k]) grouped[k]=[];
  grouped[k].push(m);
 });

 let keys=Object.keys(grouped);
 if(sort==='az') keys.sort((a,b)=>a.localeCompare(b));
 else keys.sort((a,b)=>{
  let ra=getTopRank(grouped[a][0]), rb=getTopRank(grouped[b][0]);
  if(ra!==rb) return ra-rb;
  return a.localeCompare(b);
 });

 let html='';
 keys.forEach(k=>{
  let [country, league]=k.split('::');
  let ms=grouped[k];
  let rank=getTopRank(ms[0]);
  let badge = rank<10 ? `<span style="background:#00c853;color:#000;padding:1px 6px;border-radius:8px;font-size:10px;margin-left:5px">TOP ${rank+1}</span>` : '';
  html+=`<div class="leagueHead"><span>${country} - ${league}${badge} (${ms.length})</span></div>`;
  ms.forEach(m=>{
   let idx=allMatches.indexOf(m);
   let time=getTimeStr(m);
   let isFin=(m.status==='finished'||m.status==='FT');
   let scoreText="-";
   if(isFin){
    let hs=m.home?.score ?? m.home_score ?? m.score_home ?? '?';
    let as=m.away?.score ?? m.away_score ?? m.score_away ?? '?';
    scoreText=`${hs} - ${as}`;
   } else if(m.isLive){
    let hs=m.home?.score ?? 0;
    let as=m.away?.score ?? 0;
    scoreText=`${hs} - ${as}`;
   }
   html+=`<div class="match" onclick="openMatch(${idx})"><div class="timeCol">${time}</div><div class="teamCol"><div>${m.home?.name||m.homeName||'Home'}</div><div>${m.away?.name||m.awayName||'Away'}</div></div><div class="scoreCol">${scoreText}</div></div>`;
  });
 });
 document.getElementById('list').innerHTML=html;
}

function openMatch(idx){
 let m=allMatches[idx];
 if(!m) return;
 let ft = (m.status==='finished'||m.status==='FT') ? `${m.home?.score ?? '?'} - ${m.away?.score ?? '?'}` : 'Not started';
 let ht = (m.ht && m.ht.home!=null) ? `${m.ht.home} - ${m.ht.away}` : 'No HT yet';
 let htft = (m.ht && (m.status==='finished'||m.status==='FT')) ? `${m.ht.home}-${m.ht.away} / ${m.home?.score}-${m.away?.score}` : '-';
 let time=getTimeStr(m);
 document.getElementById('modalBox').innerHTML=`
  <div style="padding:10px;background:#162616;text-align:center;font-weight:800;border-bottom:2px solid #00c853">RESULTS - FT & HT</div>
  <div class="content">
   <h3 style="text-align:center">${m.home?.name||'Home'} vs ${m.away?.name||'Away'}</h3>
   <p style="text-align:center;color:#81c784;font-size:12px">${m.league?.country||''} - ${m.league?.name||''}<br>${time} • ${m.status||''}</p>
   <div style="background:#081208;padding:12px;border-radius:10px;margin-top:10px">
    <div style="display:flex;justify-content:space-between;padding:10px 0"><span>FT:</span><b style="color:#00e676;font-size:20px">${ft}</b></div>
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #1a331a"><span>HT:</span><b style="color:#ff9800;font-size:20px">${ht}</b></div>
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #1a331a"><span>HT/FT:</span><b>${htft}</b></div>
   </div>
  </div>`;
 document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}

loadDays();
loadMatches();
</script>
</body>
</html>
