
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore TOP 10 - Europe Time</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}
.ad{background:#00ff88;color:#000;text-align:center;padding:14px;font-weight:900;cursor:pointer;border-radius:8px;margin:8px}
.head{background:#121212;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00ff88}
.tabs{display:flex;gap:6px;padding:10px;background:#121212;overflow-x:auto}
.tab{border:none;background:#222;color:#aaa;padding:10px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
.tab.active{background:#00ff88;color:#000}
.league{background:#0d1a0d;color:#00ff88;padding:9px 12px;font-weight:900;font-size:12px;display:flex;justify-content:space-between;border-left:4px solid #00ff88;margin-top:12px;letter-spacing:1px}
.match{display:flex;align-items:center;padding:14px 12px;background:#111;border-bottom:1px solid #1e1e1e;cursor:pointer}
.match:hover{background:#1c1c1c}
.time{color:#00ff88;width:50px;font-weight:900;font-size:15px}
.teams{flex:1;padding-left:10px;font-size:14px}
.score{width:45px;text-align:center;font-weight:900;font-size:15px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);justify-content:center;align-items:center;z-index:100}
.box{background:#111;border:2px solid #00ff88;border-radius:16px;padding:22px;width:92%;max-width:360px;text-align:center}
.close{background:#00ff88;color:#000;border:none;padding:12px;width:100%;border-radius:20px;font-weight:900;margin-top:15px;cursor:pointer}
.badge{background:#00ff88;color:#000;padding:2px 8px;border-radius:10px;font-size:10px;margin-left:6px}
</style></head><body>
<div class="ad" onclick="window.open('https://google.com','_blank')">🔥 AD TOP - CLICK TO EARN 🔥</div>
<div class="head"><div><b style="color:#00ff88">⚽ TOP 10 EUROPE</b><br><small style="color:#888">Flashscore Europe Time (CET)</small></div><small style="color:#00ff88">LIVE</small></div>
<div class="tabs">
<button class="tab" onclick="load('2026-10-17')">YESTERDAY 17</button>
<button class="tab active" onclick="load('2026-10-18')">TODAY 18</button>
<button class="tab" onclick="load('2026-10-19')">TOMORROW 19</button>
<button class="tab" onclick="load('2026-10-20')">20 OCT</button>
</div>
<div class="ad" onclick="window.open('https://google.com','_blank')" style="border:2px dashed #00ff88;background:transparent;color:#00ff88">💰 AD MID - CLICK HERE 💰</div>
<div id="games" style="padding:0 8px">Loading Top 10...</div>
<div id="modal" onclick="if(event.target==this)closeM()"><div class="box">
<h3 id="mtitle" style="color:#00ff88">KICK-OFF: 20:45 CET</h3>
<div style="display:flex;gap:12px;margin:18px 0"><div style="flex:1;background:#000;padding:15px;border-radius:12px"><b style="color:#00ff88">HALF TIME</b><br><span id="ht" style="font-size:22px;font-weight:900">-</span></div><div style="flex:1;background:#000;padding:15px;border-radius:12px"><b style="color:#00ff88">FULL TIME</b><br><span id="ft" style="font-size:22px;font-weight:900">-</span></div></div>
<p id="extra" style="color:#888;font-size:12px"></p>
<div class="ad" onclick="window.open('https://google.com','_blank')" style="margin:12px 0">AD IN POPUP - CLICK</div>
<button class="close" onclick="closeM()">CLOSE</button>
</div></div>
<script>
var all=[],cur='2026-10-18';
var orderNames={1:'🏆 CHAMPIONS LEAGUE',2:'🏆 EUROPA LEAGUE',3:'🏆 CONFERENCE LEAGUE',4:'🏴󐁧󐁢󐁥󐁮󐁧󐁿 PREMIER LEAGUE',5:'🇫🇷 LIGUE 1',6:'🇩🇪 BUNDESLIGA',7:'🇮🇹 SERIE A',8:'🇪🇸 LA LIGA',9:'🇳🇱 EREDIVISIE',10:'🇵🇹 PRIMEIRA LIGA'};
async function load(d){
 cur=d;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));if(event)event.target.classList.add('active');
 document.getElementById('games').innerHTML='<p style="padding:30px;text-align:center;color:#00ff88">Loading Top 10 leagues... Europe Time...</p>';
 try{let r=await fetch('/matches?date='+d);let j=await r.json();all=j.data.matches||[];render();}catch(e){document.getElementById('games').innerHTML='Error - Check API Key';}
}
function render(){
 if(!all.length){document.getElementById('games').innerHTML='<p style="padding:30px;text-align:center">No Top 10 games today<br><small style="color:#888">Only UCL, UEL, EPL, LaLiga etc show here</small></p>';return;}
 let h='';let leagues={};all.forEach(m=>{let k=m.priority;if(!leagues[k])leagues[k]=[];leagues[k].push(m);});
 Object.keys(leagues).sort((a,b)=>a-b).forEach(p=>{
  let name=orderNames[p]||'TOP LEAGUE';
  h+='<div class="league"><span>'+name+'</span><span style="color:#666">STANDINGS</span></div>';
  leagues[p].forEach(m=>{
   let tm=m.status=='finished'?'FT':(m.status=='live'?(m.liveMinute||'LIVE'):m.time);
   let sc=(m.ft_home!=null)?m.ft_home+' - '+m.ft_away:'-';
   let liveBadge=m.status=='live'?'<span class="badge">LIVE</span>':'';
   h+='<div class="match" onclick="openM(\''+m.id+'\')"><div class="time">'+tm+'</div><div class="teams">'+m.home.name+' - '+m.away.name+liveBadge+'</div><div class="score">'+sc+'</div></div>';
  });
 });
 document.getElementById('games').innerHTML=h;
}
function openM(id){
 let m=all.find(x=>String(x.id)==String(id));if(!m)return;
 document.getElementById('mtitle').textContent='KICK-OFF: '+m.time+' CET';
 document.getElementById('ht').textContent=(m.ht_home!=null)?m.ht_home+' - '+m.ht_away:'0 - 0';
 document.getElementById('ft').textContent=(m.ft_home!=null)?m.ft_home+' - '+m.ft_away:'-';
 document.getElementById('extra').textContent=m.league.name+' | '+m.status.toUpperCase()+' | Europe Time';
 document.getElementById('modal').style.display='flex';
}
function closeM(){document.getElementById('modal').style.display='none';}
load(cur);
</script></body></html>
